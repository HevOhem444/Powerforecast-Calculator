<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PowerForecast - Smart energy forecasting and power consumption calculator. Login to manage your electricity usage.">
    <title>PowerForecast — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="Assets/LOGO.png">
    <!-- Supabase JS Client & Auth System -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('powerforecast_theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        /* ===== CSS Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --transition-speed: 0.5s;
            --transition-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ===== DARK THEME (default) ===== */
        [data-theme="dark"] {
            --header-bg: #0b0933;
            --header-border: rgba(255, 255, 255, 0.08);
            --logo-power-color: #ffffff;
            --bg-gradient: linear-gradient(180deg, #0e1258 0%, #1e278b 38%, #3152d8 100%);

            --card-bg: rgba(23, 20, 61, 0.92);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            --card-title-color: #ffffff;
            --card-text-primary: #ffffff;
            --card-text-secondary: rgba(255, 255, 255, 0.85);

            --google-btn-bg: #ffffff;
            --google-btn-text: #333333;
            --google-btn-border: transparent;

            --divider-line: rgba(255, 255, 255, 0.35);
            --divider-text: #ffffff;

            --input-bg: #ffffff;
            --input-text: #222222;
            --input-placeholder: #777777;
            --input-border: transparent;
            --input-icon-color: #555555;

            --btn-bg: #04006e;
            --btn-hover: #09038e;
            --btn-text: #ffffff;

            --checkbox-bg: #ffffff;
            --checkbox-border: transparent;
            --checkbox-mark: #04006e;

            --link-color: #ffffff;
            --toggle-pill-bg: #4341aa;
            --toggle-label-color: #ffffff;
        }

        /* ===== LIGHT THEME ===== */
        [data-theme="light"] {
            --header-bg: rgba(255, 255, 255, 0.92);
            --header-border: rgba(108, 122, 224, 0.2);
            --logo-power-color: #100b46;
            --bg-gradient: linear-gradient(180deg, #ffffff 0%, #e6ecff 40%, #768bf7 100%);

            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(108, 122, 224, 0.25);
            --card-shadow: 0 16px 40px rgba(26, 16, 114, 0.15);
            --card-title-color: #100b46;
            --card-text-primary: #100b46;
            --card-text-secondary: #3d3e75;

            --google-btn-bg: #ffffff;
            --google-btn-text: #100b46;
            --google-btn-border: rgba(108, 122, 224, 0.25);

            --divider-line: rgba(108, 122, 224, 0.3);
            --divider-text: #100b46;

            --input-bg: #ffffff;
            --input-text: #100b46;
            --input-placeholder: #7778a8;
            --input-border: rgba(108, 122, 224, 0.25);
            --input-icon-color: #5a5cc7;

            --btn-bg: #1a1072;
            --btn-hover: #2b2bae;
            --btn-text: #ffffff;

            --checkbox-bg: #ffffff;
            --checkbox-border: rgba(108, 122, 224, 0.35);
            --checkbox-mark: #1a1072;

            --link-color: #1a1072;
            --toggle-pill-bg: #6c7ae0;
            --toggle-label-color: #100b46;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background: var(--bg-gradient);
            transition: background var(--transition-speed) var(--transition-ease);
            display: flex;
            flex-direction: column;
        }

        /* ===== Header Navbar ===== */
        .navbar {
            width: 100%;
            height: 70px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--header-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 50px);
            position: relative;
            z-index: 30;
            transition: background var(--transition-speed) var(--transition-ease), border-color var(--transition-speed) var(--transition-ease);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-area img {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            user-select: none;
        }

        .logo-text .power {
            color: var(--logo-power-color);
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .logo-text .forecast {
            color: #f7b02c;
        }

        /* Header Right: Theme Toggle */
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-label {
            color: var(--toggle-label-color);
            font-weight: 700;
            font-size: 1.05rem;
            user-select: none;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .toggle-switch {
            position: relative;
            width: 56px;
            height: 28px;
            cursor: pointer;
            display: inline-block;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--toggle-pill-bg);
            border-radius: 20px;
            transition: background 0.35s var(--transition-ease);
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.35s var(--transition-ease);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(28px);
        }

        /* ===== Main Container Layout ===== */
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 70px);
            align-items: center;
            justify-content: flex-end;
            padding: 20px clamp(20px, 5vw, 90px);
        }

        /* ===== Left: Bulb Container ===== */
        .bulb-wrapper {
            position: fixed;
            top: 45px;
            left: clamp(230px, 29vw, 470px);
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            width: clamp(340px, 38vw, 560px);
            display: flex;
            justify-content: center;
            animation: fadeIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.05s;
        }

        .bulb-img {
            width: 100%;
            height: auto;
            max-height: min(720px, 83vh);
            object-fit: contain;
            object-position: top center;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.35));
            transition: opacity 0.6s var(--transition-ease);
        }

        .bulb-off { opacity: 1; }
        .bulb-on { opacity: 0; position: absolute; top: 0; left: 0; }

        [data-theme="light"] .bulb-off { opacity: 0; }
        [data-theme="light"] .bulb-on { opacity: 1; }

        /* Light Mode Glow Effect */
        .bulb-glow {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 440px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 80, 0.48) 0%, rgba(255,200,50,0.18) 50%, transparent 75%);
            opacity: 0;
            transition: opacity 0.6s var(--transition-ease);
            pointer-events: none;
        }

        [data-theme="light"] .bulb-glow { opacity: 1; }

        /* ===== Right: Bento Login Card ===== */
        .login-card-container {
            z-index: 20;
            width: 100%;
            max-width: 430px;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 38px 36px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--card-text-primary);
            transition: background var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease),
                        box-shadow var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease);
            animation: fadeSlideUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.12s;
        }

        /* Google Button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 210px;
            margin: 0 auto 24px;
            padding: 10px 20px;
            background: var(--google-btn-bg);
            border: 1px solid var(--google-btn-border);
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--google-btn-text);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        background var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease);
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        }

        .google-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--divider-line);
            transition: background var(--transition-speed) var(--transition-ease);
        }

        .divider-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--divider-text);
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Input Group Pill Style */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            height: 48px;
            padding: 0 46px 0 48px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 25px;
            color: var(--input-text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        background var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease);
        }

        .input-group input::placeholder {
            color: var(--input-placeholder);
            font-weight: 400;
        }

        .input-group input:focus {
            box-shadow: 0 0 0 3px rgba(108, 122, 224, 0.5), 0 2px 8px rgba(0,0,0,0.12);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--input-icon-color);
            pointer-events: none;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--input-icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--input-text);
        }

        /* Forgot Password Link */
        .forgot-password {
            text-align: right;
            margin-top: -4px;
            margin-bottom: 16px;
        }

        .forgot-password a {
            color: var(--link-color);
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s ease, color var(--transition-speed) var(--transition-ease);
        }

        .forgot-password a:hover {
            opacity: 0.85;
            text-decoration: underline;
        }

        /* Remember Me Row */
        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .remember-me input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--checkbox-bg);
            border: 1px solid var(--checkbox-border);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .remember-me input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid var(--checkbox-mark);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .remember-me label {
            color: var(--card-text-primary);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Login Submit Button */
        .login-btn {
            width: 100%;
            height: 48px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 25px;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: background 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Signup Link Row */
        .signup-text {
            text-align: center;
            margin-top: 18px;
            font-size: 0.95rem;
            color: var(--card-text-secondary);
            font-weight: 500;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .signup-text a {
            color: var(--link-color);
            font-weight: 700;
            text-decoration: underline;
            transition: opacity 0.2s ease, color var(--transition-speed) var(--transition-ease);
        }

        .signup-text a:hover {
            opacity: 0.85;
        }

        /* Animations */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(32px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-8px); }
            30% { transform: translateX(8px); }
            45% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
            90% { transform: translateX(3px); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 960px) {
            .main-container {
                justify-content: center;
                padding: 30px 20px;
            }
            .bulb-wrapper {
                left: 50%;
                opacity: 0.18;
                max-width: 340px;
            }
            .login-card-container {
                margin-left: 0;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0 16px;
            }
            .logo-text {
                font-size: 1.25rem;
            }
            .login-card {
                padding: 30px 22px;
            }
        }

        /* Extra-small phones */
        @media (max-width: 360px) {
            .login-card {
                padding: 24px 16px;
            }
            .login-card-container {
                max-width: 100%;
            }
            .google-btn {
                width: 100%;
            }
            .main-container {
                padding: 20px 12px;
            }
        }

        /* Mid-tablet (768px-960px) refinement */
        @media (min-width: 768px) and (max-width: 960px) {
            .bulb-wrapper {
                opacity: 0.12;
            }
        }

        /* Ultra-wide screens */
        @media (min-width: 1441px) {
            .main-container {
                max-width: 1600px;
            }
        }

        /* Touch targets for touch devices */
        @media (pointer: coarse) {
            .input-group input {
                min-height: 48px;
            }
            .login-btn, .google-btn {
                min-height: 48px;
            }
        }
    </style>
</head>
<body>
    <!-- Top Header Bar -->
    <header class="navbar">
        <a href="index.html" class="logo-area">
            <img src="Assets/LOGO.png" alt="PowerForecast Logo">
            <div class="logo-text">
                <span class="power">power</span>
                <span class="forecast">forecast</span>
            </div>
        </a>
        <div class="header-right">
            <span class="theme-label" id="theme-label">Dark</span>
            <label class="toggle-switch">
                <input type="checkbox" id="theme-checkbox" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Light Bulb Hanging Graphic -->
        <div class="bulb-wrapper">
            <div class="bulb-glow"></div>
            <img src="Assets/Off.png" alt="Bulb Off" class="bulb-img bulb-off" id="bulb-off">
            <img src="Assets/On.png" alt="Bulb On" class="bulb-img bulb-on" id="bulb-on">
        </div>

        <!-- Login Form Bento Card -->
        <div class="login-card-container">
            <div class="login-card" id="login-card">
                <!-- Google Sign In -->
                <button class="google-btn" id="google-signin-btn" type="button">
                    <svg width="22" height="22" viewBox="0 0 48 48">
                        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                    </svg>
                    Google
                </button>

                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">or</span>
                    <div class="divider-line"></div>
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="M22 4L12 13L2 4"/>
                    </svg>
                    <input type="email" id="email-input" placeholder="Email" autocomplete="email">
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
                    <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                        <svg id="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="forgot-password.html" id="forgot-password-link">Forgot Password?</a>
                </div>

                <!-- Remember Me -->
                <div class="remember-me">
                    <input type="checkbox" id="remember-me-checkbox">
                    <label for="remember-me-checkbox">Remember me</label>
                </div>

                <!-- Submit Button -->
                <button class="login-btn" id="login-btn" type="button">Login</button>

                <!-- Footer Sign Up Text -->
                <p class="signup-text">New to the ball? <a href="signup.html" id="signup-link">Sign up!</a></p>
            </div>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // Theme Toggle Handler
        const themeCheckbox = document.getElementById('theme-checkbox');
        const themeLabel = document.getElementById('theme-label');
        const html = document.documentElement;

        function setTheme(isDark) {
            if (isDark) {
                html.setAttribute('data-theme', 'dark');
                themeLabel.textContent = 'Dark';
                themeCheckbox.checked = true;
                localStorage.setItem('powerforecast_theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                themeLabel.textContent = 'Light';
                themeCheckbox.checked = false;
                localStorage.setItem('powerforecast_theme', 'light');
            }
        }

        themeCheckbox.addEventListener('change', () => {
            setTheme(themeCheckbox.checked);
        });

        // Load Saved Theme
        const savedTheme = localStorage.getItem('powerforecast_theme');
        setTheme(savedTheme ? savedTheme === 'dark' : true);

        // Redirect if already authenticated
        if (window.PowerForecastAuth) {
            PowerForecastAuth.redirectIfAuthenticated('home.html');
        }

        // Email / Password Login Handler
        const loginBtn = document.getElementById('login-btn');
        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const rememberMe = document.getElementById('remember-checkbox')?.checked ?? true;
            const card = document.getElementById('login-card');

            if (!email || !password) {
                triggerShake(card);
                showError('Please enter your email and password.');
                return;
            }

            // Set loading state
            const originalBtnText = loginBtn.textContent;
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span style="display:inline-block;animation:spin 1s linear infinite;">⏳</span> Logging in...';

            try {
                const { user, session } = await PowerForecastAuth.signIn(email, password, rememberMe);
                
                // Clear any previous error
                const errEl = document.getElementById('login-error');
                if (errEl) errEl.remove();

                // Check URL params for redirect
                const params = new URLSearchParams(window.location.search);
                const redirectTo = params.get('redirect') || 'home.html';
                window.location.href = redirectTo;
            } catch (error) {
                console.error('Login error:', error);
                triggerShake(card);
                let message = error.message || 'Invalid email or password.';
                if (message.includes('Invalid login credentials')) {
                    message = 'Invalid email or password. Please check your credentials.';
                } else if (message.includes('Email not confirmed')) {
                    message = 'Please confirm your email address before logging in.';
                }
                showError(message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = originalBtnText;
            }
        });

        // Google Sign-In Handler
        const googleBtn = document.getElementById('google-login-btn') || document.querySelector('.google-btn');
        if (googleBtn) {
            googleBtn.addEventListener('click', async () => {
                try {
                    googleBtn.disabled = true;
                    googleBtn.innerHTML = 'Connecting to Google...';
                    await PowerForecastAuth.signInWithGoogle();
                } catch (err) {
                    console.error('Google Sign-In Error:', err);
                    showError(err.message || 'Failed to initialize Google Sign-In.');
                    googleBtn.disabled = false;
                    googleBtn.innerHTML = `
                        <svg width="22" height="22" viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                        </svg>
                        Google
                    `;
                }
            });
        }

        function triggerShake(element) {
            element.style.animation = 'none';
            element.offsetHeight;
            element.style.animation = 'shake 0.4s ease';
        }

        function showError(message) {
            let errMsg = document.getElementById('login-error');
            if (!errMsg) {
                errMsg = document.createElement('p');
                errMsg.id = 'login-error';
                errMsg.style.cssText = 'color:#ff6b6b;font-size:0.85rem;text-align:center;margin-top:12px;font-weight:600;';
                document.getElementById('login-btn').insertAdjacentElement('afterend', errMsg);
            }
            errMsg.textContent = message;
        }

        // Enter key handling
        document.getElementById('password-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('login-btn').click();
            }
        });

        document.getElementById('email-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('password-input').focus();
            }
        });

        // Password Show/Hide Toggle
        document.getElementById('password-toggle').addEventListener('click', () => {
            const pwInput = document.getElementById('password-input');
            const eyeOpen = document.getElementById('eye-open');
            const eyeClosed = document.getElementById('eye-closed');

            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                pwInput.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        });
    </script>
</body>
</html>
