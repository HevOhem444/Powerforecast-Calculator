<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PowerForecast - Create your account to start tracking and forecasting your electricity consumption.">
    <title>PowerForecast — Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="Assets/LOGO.png">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('powerforecast_theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        /* ===== CSS Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --transition-speed: 0.5s;
            --transition-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ===== DARK THEME (default) ===== */
        [data-theme="dark"] {
            --header-bg: #0b0933;
            --header-border: rgba(255, 255, 255, 0.08);
            --logo-power-color: #ffffff;
            --bg-gradient: linear-gradient(180deg, #0e1258 0%, #1e278b 38%, #3152d8 100%);

            --card-bg: rgba(23, 20, 61, 0.92);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            --card-title-color: #ffffff;
            --card-text-primary: #ffffff;
            --card-text-secondary: rgba(255, 255, 255, 0.85);

            --google-btn-bg: #ffffff;
            --google-btn-text: #333333;
            --google-btn-border: transparent;

            --divider-line: rgba(255, 255, 255, 0.35);
            --divider-text: #ffffff;

            --input-bg: #ffffff;
            --input-text: #222222;
            --input-placeholder: #777777;
            --input-border: transparent;
            --input-icon-color: #555555;

            --btn-bg: #04006e;
            --btn-hover: #09038e;
            --btn-text: #ffffff;

            --checkbox-bg: #ffffff;
            --checkbox-border: transparent;
            --checkbox-mark: #04006e;

            --link-color: #ffffff;
            --toggle-pill-bg: #4341aa;
            --toggle-label-color: #ffffff;
        }

        /* ===== LIGHT THEME ===== */
        [data-theme="light"] {
            --header-bg: rgba(255, 255, 255, 0.92);
            --header-border: rgba(108, 122, 224, 0.2);
            --logo-power-color: #100b46;
            --bg-gradient: linear-gradient(180deg, #ffffff 0%, #e6ecff 40%, #768bf7 100%);

            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(108, 122, 224, 0.25);
            --card-shadow: 0 16px 40px rgba(26, 16, 114, 0.15);
            --card-title-color: #100b46;
            --card-text-primary: #100b46;
            --card-text-secondary: #3d3e75;

            --google-btn-bg: #ffffff;
            --google-btn-text: #100b46;
            --google-btn-border: rgba(108, 122, 224, 0.25);

            --divider-line: rgba(108, 122, 224, 0.3);
            --divider-text: #100b46;

            --input-bg: #ffffff;
            --input-text: #100b46;
            --input-placeholder: #7778a8;
            --input-border: rgba(108, 122, 224, 0.25);
            --input-icon-color: #5a5cc7;

            --btn-bg: #1a1072;
            --btn-hover: #2b2bae;
            --btn-text: #ffffff;

            --checkbox-bg: #ffffff;
            --checkbox-border: rgba(108, 122, 224, 0.35);
            --checkbox-mark: #1a1072;

            --link-color: #1a1072;
            --toggle-pill-bg: #6c7ae0;
            --toggle-label-color: #100b46;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background: var(--bg-gradient);
            transition: background var(--transition-speed) var(--transition-ease);
            display: flex;
            flex-direction: column;
        }

        /* ===== Header Navbar ===== */
        .navbar {
            width: 100%;
            height: 70px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--header-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 50px);
            position: relative;
            z-index: 30;
            transition: background var(--transition-speed) var(--transition-ease), border-color var(--transition-speed) var(--transition-ease);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-area img {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            user-select: none;
        }

        .logo-text .power {
            color: var(--logo-power-color);
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .logo-text .forecast {
            color: #f7b02c;
        }

        /* Header Right: Dark Toggle */
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-label {
            color: var(--toggle-label-color);
            font-weight: 700;
            font-size: 1.05rem;
            user-select: none;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .toggle-switch {
            position: relative;
            width: 56px;
            height: 28px;
            cursor: pointer;
            display: inline-block;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--toggle-pill-bg);
            border-radius: 20px;
            transition: background 0.35s var(--transition-ease);
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.35s var(--transition-ease);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(28px);
        }

        /* ===== Main Container Layout ===== */
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 70px);
            align-items: center;
            justify-content: flex-end;
            padding: 20px clamp(20px, 5vw, 90px);
        }

        /* ===== Left: Bulb Container ===== */
        .bulb-wrapper {
            position: fixed;
            top: 45px;
            left: clamp(230px, 29vw, 470px);
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            width: clamp(340px, 38vw, 560px);
            display: flex;
            justify-content: center;
            animation: fadeIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.05s;
        }

        .bulb-img {
            width: 100%;
            height: auto;
            max-height: min(720px, 83vh);
            object-fit: contain;
            object-position: top center;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.35));
            transition: opacity 0.6s var(--transition-ease);
        }

        .bulb-off { opacity: 1; }
        .bulb-on { opacity: 0; position: absolute; top: 0; left: 0; }

        [data-theme="light"] .bulb-off { opacity: 0; }
        [data-theme="light"] .bulb-on { opacity: 1; }

        /* Light Mode Glow Effect */
        .bulb-glow {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 440px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 80, 0.48) 0%, rgba(255,200,50,0.18) 50%, transparent 75%);
            opacity: 0;
            transition: opacity 0.6s var(--transition-ease);
            pointer-events: none;
        }

        [data-theme="light"] .bulb-glow { opacity: 1; }

        /* ===== Right: Bento Signup Card ===== */
        .signup-card-container {
            z-index: 20;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        .signup-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 34px 34px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--card-text-primary);
            transition: background var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease),
                        box-shadow var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease);
            animation: fadeSlideUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.12s;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: var(--card-title-color);
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Google Button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 210px;
            margin: 0 auto 20px;
            padding: 10px 20px;
            background: var(--google-btn-bg);
            border: 1px solid var(--google-btn-border);
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--google-btn-text);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        background var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease);
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        }

        .google-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--divider-line);
            transition: background var(--transition-speed) var(--transition-ease);
        }

        .divider-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--divider-text);
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Input Group Pill Style */
        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .input-group input {
            width: 100%;
            height: 46px;
            padding: 0 46px 0 46px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 25px;
            color: var(--input-text);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        background var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease);
        }

        .input-group input::placeholder {
            color: var(--input-placeholder);
            font-weight: 400;
        }

        .input-group input:focus {
            box-shadow: 0 0 0 3px rgba(108, 122, 224, 0.5), 0 2px 8px rgba(0,0,0,0.12);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--input-icon-color);
            pointer-events: none;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--input-icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--input-text);
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
        }

        /* Password Match Hint */
        .password-hint {
            font-size: 0.82rem;
            font-weight: 600;
            margin-top: -6px;
            margin-bottom: 12px;
            padding-left: 8px;
            transition: all 0.2s ease;
        }

        .password-hint.hidden {
            display: none;
        }

        .password-hint.match {
            color: #51cf66;
        }

        .password-hint.no-match {
            color: #ff6b6b;
        }

        /* Terms & Conditions Checkbox */
        .terms-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .terms-check input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--checkbox-bg);
            border: 1px solid var(--checkbox-border);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            outline: none;
            flex-shrink: 0;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .terms-check input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid var(--checkbox-mark);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .terms-check label {
            color: var(--card-text-primary);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            line-height: 1.3;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .terms-check label a {
            color: var(--link-color);
            font-weight: 700;
            text-decoration: underline;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Signup Submit Button */
        .signup-btn {
            width: 100%;
            height: 48px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 25px;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: background 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .signup-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        /* Login Link Row */
        .login-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.92rem;
            color: var(--card-text-secondary);
            font-weight: 500;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .login-text a {
            color: var(--link-color);
            font-weight: 700;
            text-decoration: underline;
            transition: opacity 0.2s ease, color var(--transition-speed) var(--transition-ease);
        }

        .login-text a:hover {
            opacity: 0.85;
        }

        /* Keyframes */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(32px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-8px); }
            30% { transform: translateX(8px); }
            45% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
            90% { transform: translateX(3px); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 960px) {
            .main-container {
                justify-content: center;
                padding: 30px 20px;
            }
            .bulb-wrapper {
                left: 50%;
                opacity: 0.18;
                max-width: 340px;
            }
            .signup-card-container {
                margin-left: 0;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0 16px;
            }
            .logo-text {
                font-size: 1.25rem;
            }
            .signup-card {
                padding: 26px 20px;
            }
        }

        /* Extra-small phones */
        @media (max-width: 360px) {
            .signup-card {
                padding: 22px 14px;
            }
            .signup-card-container {
                max-width: 100%;
            }
            .google-btn {
                width: 100%;
            }
            .main-container {
                padding: 20px 12px;
            }
        }

        /* Mid-tablet (768px-960px) refinement */
        @media (min-width: 768px) and (max-width: 960px) {
            .bulb-wrapper {
                opacity: 0.12;
            }
        }

        /* Ultra-wide screens */
        @media (min-width: 1441px) {
            .main-container {
                max-width: 1600px;
            }
        }

        /* Touch targets for touch devices */
        @media (pointer: coarse) {
            .input-group input {
                min-height: 48px;
            }
            .signup-btn, .google-btn {
                min-height: 48px;
            }
        }
    </style>
</head>
<body>
    <!-- Top Header Bar -->
    <header class="navbar">
        <a href="index.html" class="logo-area">
            <img src="Assets/LOGO.png" alt="PowerForecast Logo">
            <div class="logo-text">
                <span class="power">power</span>
                <span class="forecast">forecast</span>
            </div>
        </a>
        <div class="header-right">
            <span class="theme-label" id="theme-label">Dark</span>
            <label class="toggle-switch">
                <input type="checkbox" id="theme-checkbox" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Light Bulb Graphic -->
        <div class="bulb-wrapper">
            <div class="bulb-glow"></div>
            <img src="Assets/Off.png" alt="Bulb Off" class="bulb-img bulb-off" id="bulb-off">
            <img src="Assets/On.png" alt="Bulb On" class="bulb-img bulb-on" id="bulb-on">
        </div>

        <!-- Signup Card Container -->
        <div class="signup-card-container">
            <div class="signup-card" id="signup-card">
                <h1 class="card-title">Create Account</h1>

                <!-- Google Sign Up -->
                <button class="google-btn" id="google-signup-btn" type="button">
                    <svg width="22" height="22" viewBox="0 0 48 48">
                        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                    </svg>
                    Google
                </button>

                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">or</span>
                    <div class="divider-line"></div>
                </div>

                <!-- Full Name -->
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="fullname-input" placeholder="Full Name" autocomplete="name">
                </div>

                <!-- Email -->
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="M22 4L12 13L2 4"/>
                    </svg>
                    <input type="email" id="email-input" placeholder="Email" autocomplete="email">
                </div>

                <!-- Password -->
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password-input" placeholder="Password" autocomplete="new-password">
                    <button type="button" class="password-toggle" id="password-toggle-1" aria-label="Toggle password visibility">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="confirm-password-input" placeholder="Confirm Password" autocomplete="new-password">
                    <button type="button" class="password-toggle" id="password-toggle-2" aria-label="Toggle confirm password visibility">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <!-- Password match hint -->
                <p class="password-hint hidden" id="password-hint">Passwords match</p>

                <!-- Terms & Conditions -->
                <div class="terms-check">
                    <input type="checkbox" id="terms-checkbox">
                    <label for="terms-checkbox">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <!-- Sign Up Button -->
                <button class="signup-btn" id="signup-btn" type="button">Sign Up</button>

                <!-- Login redirect -->
                <p class="login-text">Already have an account? <a href="login.html" id="login-link">Log in</a></p>
            </div>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // Theme Toggle
        const themeCheckbox = document.getElementById('theme-checkbox');
        const themeLabel = document.getElementById('theme-label');
        const html = document.documentElement;

        function setTheme(isDark) {
            if (isDark) {
                html.setAttribute('data-theme', 'dark');
                themeLabel.textContent = 'Dark';
                themeCheckbox.checked = true;
                localStorage.setItem('powerforecast_theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                themeLabel.textContent = 'Light';
                themeCheckbox.checked = false;
                localStorage.setItem('powerforecast_theme', 'light');
            }
        }

        themeCheckbox.addEventListener('change', () => {
            setTheme(themeCheckbox.checked);
        });

        // Initialize from localStorage or default to dark
        const savedTheme = localStorage.getItem('powerforecast_theme');
        setTheme(savedTheme ? savedTheme === 'dark' : true);

        // Password match checker
        const passwordInput = document.getElementById('password-input');
        const confirmInput = document.getElementById('confirm-password-input');
        const hint = document.getElementById('password-hint');

        function checkPasswordMatch() {
            const pw = passwordInput.value;
            const cpw = confirmInput.value;

            if (!cpw) {
                hint.classList.add('hidden');
                hint.classList.remove('match', 'no-match');
                return;
            }

            hint.classList.remove('hidden');
            if (pw === cpw) {
                hint.textContent = '✓ Passwords match';
                hint.classList.add('match');
                hint.classList.remove('no-match');
            } else {
                hint.textContent = '✗ Passwords do not match';
                hint.classList.add('no-match');
                hint.classList.remove('match');
            }
        }

        passwordInput.addEventListener('input', checkPasswordMatch);
        confirmInput.addEventListener('input', checkPasswordMatch);

        // Sign Up button logic
        document.getElementById('signup-btn').addEventListener('click', () => {
            const fullname = document.getElementById('fullname-input').value.trim();
            const email = document.getElementById('email-input').value.trim();
            const password = passwordInput.value.trim();
            const confirmPw = confirmInput.value.trim();
            const termsChecked = document.getElementById('terms-checkbox').checked;
            const card = document.getElementById('signup-card');

            if (!fullname || !email || !password || !confirmPw) {
                triggerShake(card);
                showError('Please fill in all fields.');
                return;
            }

            if (password.length < 8) {
                triggerShake(card);
                showError('Password must be at least 8 characters.');
                return;
            }

            if (password !== confirmPw) {
                triggerShake(card);
                showError('Passwords do not match.');
                return;
            }

            if (!termsChecked) {
                triggerShake(card);
                showError('You must agree to the Terms of Service.');
                return;
            }

            // Success — redirect to login
            window.location.href = 'login.html';
        });

        function triggerShake(element) {
            element.style.animation = 'none';
            element.offsetHeight;
            element.style.animation = 'shake 0.4s ease';
        }

        function showError(msg) {
            let errMsg = document.getElementById('signup-error');
            if (!errMsg) {
                errMsg = document.createElement('p');
                errMsg.id = 'signup-error';
                errMsg.style.cssText = 'color:#ff6b6b;font-size:0.85rem;text-align:center;margin-top:12px;font-weight:600;';
                document.getElementById('signup-btn').insertAdjacentElement('afterend', errMsg);
            }
            errMsg.textContent = msg;
        }

        // Enter key navigation
        document.getElementById('fullname-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('email-input').focus();
        });
        document.getElementById('email-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') passwordInput.focus();
        });
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') confirmInput.focus();
        });
        confirmInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('signup-btn').click();
        });

        // Password show/hide toggles
        function setupPasswordToggle(toggleId, inputId) {
            document.getElementById(toggleId).addEventListener('click', function() {
                const input = document.getElementById(inputId);
                const eyeOpen = this.querySelector('.eye-open');
                const eyeClosed = this.querySelector('.eye-closed');

                if (input.type === 'password') {
                    input.type = 'text';
                    eyeOpen.style.display = 'none';
                    eyeClosed.style.display = 'block';
                } else {
                    input.type = 'password';
                    eyeOpen.style.display = 'block';
                    eyeClosed.style.display = 'none';
                }
            });
        }

        setupPasswordToggle('password-toggle-1', 'password-input');
        setupPasswordToggle('password-toggle-2', 'confirm-password-input');
    </script>
</body>
</html>
