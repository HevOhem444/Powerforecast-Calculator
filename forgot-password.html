<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PowerForecast - Reset your password to regain access to your account.">
    <title>PowerForecast — Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="Assets/LOGO.png">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('powerforecast_theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        /* ===== CSS Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --transition-speed: 0.5s;
            --transition-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ===== DARK THEME (default) ===== */
        [data-theme="dark"] {
            --header-bg: #0b0933;
            --header-border: rgba(255, 255, 255, 0.08);
            --logo-power-color: #ffffff;
            --bg-gradient: linear-gradient(180deg, #0e1258 0%, #1e278b 38%, #3152d8 100%);

            --card-bg: rgba(23, 20, 61, 0.92);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            --card-title-color: #ffffff;
            --card-text-primary: #ffffff;
            --card-text-secondary: rgba(255, 255, 255, 0.85);

            --input-bg: #ffffff;
            --input-text: #222222;
            --input-placeholder: #777777;
            --input-border: transparent;
            --input-icon-color: #555555;

            --btn-bg: #04006e;
            --btn-hover: #09038e;
            --btn-text: #ffffff;

            --link-color: #ffffff;
            --toggle-pill-bg: #4341aa;
            --toggle-label-color: #ffffff;

            --icon-circle-bg: rgba(255, 255, 255, 0.08);
            --icon-circle-border: rgba(255, 255, 255, 0.15);
            --icon-circle-color: #f7b02c;
        }

        /* ===== LIGHT THEME ===== */
        [data-theme="light"] {
            --header-bg: rgba(255, 255, 255, 0.92);
            --header-border: rgba(108, 122, 224, 0.2);
            --logo-power-color: #100b46;
            --bg-gradient: linear-gradient(180deg, #ffffff 0%, #e6ecff 40%, #768bf7 100%);

            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(108, 122, 224, 0.25);
            --card-shadow: 0 16px 40px rgba(26, 16, 114, 0.15);
            --card-title-color: #100b46;
            --card-text-primary: #100b46;
            --card-text-secondary: #3d3e75;

            --input-bg: #ffffff;
            --input-text: #100b46;
            --input-placeholder: #7778a8;
            --input-border: rgba(108, 122, 224, 0.25);
            --input-icon-color: #5a5cc7;

            --btn-bg: #1a1072;
            --btn-hover: #2b2bae;
            --btn-text: #ffffff;

            --link-color: #1a1072;
            --toggle-pill-bg: #6c7ae0;
            --toggle-label-color: #100b46;

            --icon-circle-bg: rgba(108, 122, 224, 0.12);
            --icon-circle-border: rgba(108, 122, 224, 0.25);
            --icon-circle-color: #1a1072;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background: var(--bg-gradient);
            transition: background var(--transition-speed) var(--transition-ease);
            display: flex;
            flex-direction: column;
        }

        /* ===== Header Navbar ===== */
        .navbar {
            width: 100%;
            height: 70px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--header-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 50px);
            position: relative;
            z-index: 30;
            transition: background var(--transition-speed) var(--transition-ease), border-color var(--transition-speed) var(--transition-ease);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-area img {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            user-select: none;
        }

        .logo-text .power {
            color: var(--logo-power-color);
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .logo-text .forecast {
            color: #f7b02c;
        }

        /* Header Right: Dark Toggle */
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-label {
            color: var(--toggle-label-color);
            font-weight: 700;
            font-size: 1.05rem;
            user-select: none;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .toggle-switch {
            position: relative;
            width: 56px;
            height: 28px;
            cursor: pointer;
            display: inline-block;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--toggle-pill-bg);
            border-radius: 20px;
            transition: background 0.35s var(--transition-ease);
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.35s var(--transition-ease);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(28px);
        }

        /* ===== Main Container Layout ===== */
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 70px);
            align-items: center;
            justify-content: flex-end;
            padding: 20px clamp(20px, 5vw, 90px);
        }

        /* ===== Left: Bulb Container ===== */
        .bulb-wrapper {
            position: fixed;
            top: 45px;
            left: clamp(230px, 29vw, 470px);
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            width: clamp(340px, 38vw, 560px);
            display: flex;
            justify-content: center;
            animation: fadeIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.05s;
        }

        .bulb-img {
            width: 100%;
            height: auto;
            max-height: min(720px, 83vh);
            object-fit: contain;
            object-position: top center;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.35));
            transition: opacity 0.6s var(--transition-ease);
        }

        .bulb-off { opacity: 1; }
        .bulb-on { opacity: 0; position: absolute; top: 0; left: 0; }

        [data-theme="light"] .bulb-off { opacity: 0; }
        [data-theme="light"] .bulb-on { opacity: 1; }

        /* Light Mode Glow Effect */
        .bulb-glow {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 440px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 80, 0.48) 0%, rgba(255,200,50,0.18) 50%, transparent 75%);
            opacity: 0;
            transition: opacity 0.6s var(--transition-ease);
            pointer-events: none;
        }

        [data-theme="light"] .bulb-glow { opacity: 1; }

        /* ===== Right: Bento Forgot Card ===== */
        .forgot-card-container {
            z-index: 20;
            width: 100%;
            max-width: 430px;
            box-sizing: border-box;
        }

        .forgot-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 38px 36px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--card-text-primary);
            transition: background var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease),
                        box-shadow var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease);
            animation: fadeSlideUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) both;
            animation-delay: 0.12s;
        }

        /* Lock Icon Wrapper */
        .lock-icon-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        .lock-icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--icon-circle-bg);
            border: 1px solid var(--icon-circle-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--icon-circle-color);
            transition: background var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease);
        }

        .lock-icon-circle svg {
            width: 30px;
            height: 30px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            color: var(--card-title-color);
            transition: color var(--transition-speed) var(--transition-ease);
        }

        .card-subtitle {
            font-size: 0.95rem;
            color: var(--card-text-secondary);
            text-align: center;
            line-height: 1.45;
            margin-bottom: 24px;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Input Group Pill Style */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            height: 48px;
            padding: 0 20px 0 48px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 25px;
            color: var(--input-text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        background var(--transition-speed) var(--transition-ease),
                        color var(--transition-speed) var(--transition-ease),
                        border-color var(--transition-speed) var(--transition-ease);
        }

        .input-group input::placeholder {
            color: var(--input-placeholder);
            font-weight: 400;
        }

        .input-group input:focus {
            box-shadow: 0 0 0 3px rgba(108, 122, 224, 0.5), 0 2px 8px rgba(0,0,0,0.12);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--input-icon-color);
            pointer-events: none;
            transition: color var(--transition-speed) var(--transition-ease);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            height: 48px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 25px;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transition: background 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .submit-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Back to Login Link */
        .back-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
        }

        .back-text a {
            color: var(--link-color);
            font-weight: 700;
            text-decoration: underline;
            transition: opacity 0.2s ease, color var(--transition-speed) var(--transition-ease);
        }

        .back-text a:hover {
            opacity: 0.85;
        }

        /* Success View State */
        .form-state.hidden {
            display: none;
        }

        .success-message {
            display: none;
            text-align: center;
        }

        .success-message.visible {
            display: block;
            animation: fadeIn 0.5s ease-out both;
        }

        .success-icon-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .success-icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(81, 207, 102, 0.18);
            border: 1px solid rgba(81, 207, 102, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #51cf66;
        }

        .success-icon-circle svg {
            width: 32px;
            height: 32px;
        }

        .success-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--card-title-color);
        }

        .success-subtitle {
            font-size: 0.95rem;
            color: var(--card-text-secondary);
            line-height: 1.45;
            margin-bottom: 24px;
        }

        .success-subtitle strong {
            color: #f7b02c;
        }

        /* Keyframes */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(32px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-8px); }
            30% { transform: translateX(8px); }
            45% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
            90% { transform: translateX(3px); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 960px) {
            .main-container {
                justify-content: center;
                padding: 30px 20px;
            }
            .bulb-wrapper {
                left: 50%;
                opacity: 0.18;
                max-width: 340px;
            }
            .forgot-card-container {
                margin-left: 0;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0 16px;
            }
            .logo-text {
                font-size: 1.25rem;
            }
            .forgot-card {
                padding: 30px 22px;
            }
        }

        /* Extra-small phones */
        @media (max-width: 360px) {
            .forgot-card {
                padding: 24px 16px;
            }
            .forgot-card-container {
                max-width: 100%;
            }
            .main-container {
                padding: 20px 12px;
            }
        }

        /* Mid-tablet (768px-960px) refinement */
        @media (min-width: 768px) and (max-width: 960px) {
            .bulb-wrapper {
                opacity: 0.12;
            }
        }

        /* Ultra-wide screens */
        @media (min-width: 1441px) {
            .main-container {
                max-width: 1600px;
            }
        }

        /* Touch targets for touch devices */
        @media (pointer: coarse) {
            .input-group input {
                min-height: 48px;
            }
            .submit-btn {
                min-height: 48px;
            }
        }
    </style>
</head>
<body>
    <!-- Top Header Bar -->
    <header class="navbar">
        <a href="index.html" class="logo-area">
            <img src="Assets/LOGO.png" alt="PowerForecast Logo">
            <div class="logo-text">
                <span class="power">power</span>
                <span class="forecast">forecast</span>
            </div>
        </a>
        <div class="header-right">
            <span class="theme-label" id="theme-label">Dark</span>
            <label class="toggle-switch">
                <input type="checkbox" id="theme-checkbox" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Light Bulb Graphic -->
        <div class="bulb-wrapper">
            <div class="bulb-glow"></div>
            <img src="Assets/Off.png" alt="Bulb Off" class="bulb-img bulb-off" id="bulb-off">
            <img src="Assets/On.png" alt="Bulb On" class="bulb-img bulb-on" id="bulb-on">
        </div>

        <!-- Forgot Card Container -->
        <div class="forgot-card-container">
            <div class="forgot-card" id="forgot-card">

                <!-- Form State -->
                <div class="form-state" id="form-state">
                    <div class="lock-icon-wrapper">
                        <div class="lock-icon-circle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </div>
                    </div>

                    <h1 class="card-title">Forgot Password?</h1>
                    <p class="card-subtitle">No worries! Enter your email address below and we'll send you a link to reset your password.</p>

                    <!-- Email Input -->
                    <div class="input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <path d="M22 4L12 13L2 4"/>
                        </svg>
                        <input type="email" id="email-input" placeholder="Enter your email" autocomplete="email">
                    </div>

                    <!-- Submit Button -->
                    <button class="submit-btn" id="submit-btn" type="button">Send Reset Link</button>

                    <!-- Back to login -->
                    <p class="back-text"><a href="login.html" id="back-login-link">← Back to Login</a></p>
                </div>

                <!-- Success State -->
                <div class="success-message" id="success-state">
                    <div class="success-icon-wrapper">
                        <div class="success-icon-circle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                    </div>

                    <p class="success-title">Check your inbox!</p>
                    <p class="success-subtitle">We've sent a password reset link to<br><strong id="sent-email"></strong></p>

                    <button class="submit-btn" id="resend-btn" type="button" style="background: transparent; border: 2px solid var(--card-border); color: var(--card-text-primary); box-shadow: none;">Resend Email</button>

                    <p class="back-text" style="margin-top: 18px;"><a href="login.html">← Back to Login</a></p>
                </div>

            </div>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // Theme Toggle
        const themeCheckbox = document.getElementById('theme-checkbox');
        const themeLabel = document.getElementById('theme-label');
        const html = document.documentElement;

        function setTheme(isDark) {
            if (isDark) {
                html.setAttribute('data-theme', 'dark');
                themeLabel.textContent = 'Dark';
                themeCheckbox.checked = true;
                localStorage.setItem('powerforecast_theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                themeLabel.textContent = 'Light';
                themeCheckbox.checked = false;
                localStorage.setItem('powerforecast_theme', 'light');
            }
        }

        themeCheckbox.addEventListener('change', () => {
            setTheme(themeCheckbox.checked);
        });

        // Initialize from localStorage or default to dark
        const savedTheme = localStorage.getItem('powerforecast_theme');
        setTheme(savedTheme ? savedTheme === 'dark' : true);

        // Submit handler
        document.getElementById('submit-btn').addEventListener('click', () => {
            const email = document.getElementById('email-input').value.trim();
            const card = document.getElementById('forgot-card');

            if (!email) {
                triggerShake(card);
                showError('Please enter your email address.');
                return;
            }

            // Basic email format validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                triggerShake(card);
                showError('Please enter a valid email address.');
                return;
            }

            const errEl = document.getElementById('forgot-error');
            if (errEl) errEl.remove();

            document.getElementById('form-state').classList.add('hidden');
            document.getElementById('success-state').classList.add('visible');
            document.getElementById('sent-email').textContent = email;
        });

        // Resend button
        document.getElementById('resend-btn').addEventListener('click', () => {
            const btn = document.getElementById('resend-btn');
            btn.textContent = 'Email Resent ✓';
            btn.style.borderColor = 'rgba(81, 207, 102, 0.6)';
            btn.style.color = '#51cf66';
            setTimeout(() => {
                btn.textContent = 'Resend Email';
                btn.style.borderColor = 'var(--card-border)';
                btn.style.color = 'var(--card-text-primary)';
            }, 3000);
        });

        function triggerShake(element) {
            element.style.animation = 'none';
            element.offsetHeight;
            element.style.animation = 'shake 0.4s ease';
        }

        function showError(msg) {
            let errMsg = document.getElementById('forgot-error');
            if (!errMsg) {
                errMsg = document.createElement('p');
                errMsg.id = 'forgot-error';
                errMsg.style.cssText = 'color:#ff6b6b;font-size:0.85rem;text-align:center;margin-top:12px;font-weight:600;';
                document.getElementById('submit-btn').insertAdjacentElement('afterend', errMsg);
            }
            errMsg.textContent = msg;
        }

        // Enter key to submit
        document.getElementById('email-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('submit-btn').click();
        });
    </script>
</body>
</html>
